<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mia – Animationstest (nur Entwicklung)</title>
    <style>
      body { margin: 0; font: 15px system-ui, sans-serif; background: #f4f4f4; color: #222; }
      h1 { font-size: 20px; margin: 14px 18px 4px; } p.hint { margin: 0 18px 10px; color: #555; }
      .bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 0 18px 12px; }
      .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 0 18px 18px; }
      .card { border: 1px solid #ccc; border-radius: 8px; overflow: hidden; background: #fff; }
      .card h3 { margin: 0; padding: 4px 8px; font-size: 13px; background: #eee; }
      .pair { display: flex; } .pair canvas { width: 50%; height: auto; display: block; }
      .light { background: #eef6ff; } .dark { background: #20242b; }
      table { border-collapse: collapse; margin: 0 18px 24px; font-size: 13px; } td, th { border: 1px solid #ccc; padding: 3px 8px; } tr.bad { background: #ffe3e3; }
    </style>
  </head>
  <body>
    <h1>Mia – alle Animationen</h1>
    <p class="hint">Je Karte: links heller, rechts dunkler Hintergrund. Rote Linie = Bodenlinie, graue Linie = Zellenmitte. Gespiegelte Varianten sind markiert.</p>
    <div class="bar">
      <label>Tempo <input id="spd" type="range" min="0" max="1.3" step="0.05" value="0.8" /> <b id="spdv">0.8</b></label>
      <label><input id="grid" type="checkbox" checked /> Linien</label>
      <button id="cel">Feiern</button>
    </div>
    <div id="raw" class="row"></div>
    <h1 style="font-size:17px">Zustandsautomat (wie im Spiel)</h1>
    <div id="sm" class="row"></div>
    <h1 style="font-size:17px">Porträts</h1>
    <div id="por" class="row"></div>
    <h1 style="font-size:17px">Messwerte der Frames (Kanten, Größe, Bodenlinie)</h1>
    <div id="rep"></div>
    <script type="module" src="/src/dev/miaTest.ts"></script>
  </body>
</html>
